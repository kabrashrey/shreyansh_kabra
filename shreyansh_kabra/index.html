<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shreyansh Kabra | Software Engineer</title>
    <meta
      name="description"
      content="Shreyansh Kabra — Software Engineer specializing in scalable backend systems, cloud, and AI/ML. M.S. Computer Science @ USC. Ex-HPE, AWS."
    />
    <meta
      name="keywords"
      content="Shreyansh Kabra, Software Engineer, Backend Developer, Cloud, AI, ML, RAG, USC, AWS, HPE, Portfolio"
    />
    <meta name="author" content="Shreyansh Kabra" />
    <meta
      name="theme-color"
      content="#f5f1ea"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121110"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="canonical" href="%SITE_URL%" />

    <!-- Favicons (SVG adapts to light/dark; PNGs are fallbacks) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />


    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="Shreyansh Kabra | Software Engineer" />
    <meta
      property="og:description"
      content="Software Engineer specializing in scalable backend systems, cloud, and AI/ML. M.S. CS @ USC."
    />
    <meta
      property="og:image"
      content="%SITE_URL%og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Shreyansh Kabra — Software Engineer" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shreyansh Kabra | Software Engineer" />
    <meta
      name="twitter:description"
      content="Software Engineer specializing in scalable backend systems, cloud, and AI/ML. M.S. CS @ USC."
    />
    <meta
      name="twitter:image"
      content="%SITE_URL%og-image.png"
    />
  </head>
  <body>
    <!-- Apply the theme before first paint to avoid a light-mode flash -->
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {}
        if (
          t === "dark" ||
          (t !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.body.classList.add("dark-mode");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
